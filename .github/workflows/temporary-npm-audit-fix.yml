name: Temporary npm audit lock refresh

on:
  push:
    branches:
      - chore/codex-cloud-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/codex-cloud-foundation
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/publisher-web/package-lock.json
      - name: Refresh customer web lock
        working-directory: apps/web
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit
      - name: Refresh publisher web lock
        working-directory: apps/publisher-web
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit
      - name: Commit audited locks and remove this temporary workflow
        env:
          TARGET_BRANCH: chore/codex-cloud-foundation
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "apps/publisher-web/package-lock.json";
          fs.writeFileSync(path, JSON.stringify(JSON.parse(fs.readFileSync(path, "utf8"))));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-npm-audit-fix.yml
          git add apps/web/package-lock.json apps/publisher-web/package-lock.json
          git diff --cached --check
          git commit -m "Refresh npm locks for current advisories"
          git push origin "HEAD:${TARGET_BRANCH}"
