name: Closed-loop governance bootstrap

on:
  push:
    branches:
      - agent/closed-loop-risk-platform
  pull_request:
    branches:
      - agent/initial-platform
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closed-loop-governance-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/closed-loop-risk-platform
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend
        working-directory: apps/api
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Format and lint backend
        working-directory: apps/api
        run: |
          .venv/bin/ruff format \
            src/traceless_api/db/governance_models.py \
            src/traceless_api/models/governance.py \
            src/traceless_api/services/risk_governance.py \
            src/traceless_api/api/routes/governance.py \
            tests/test_risk_governance.py \
            migrations/versions/c4a8e2d7f910_add_closed_loop_risk_governance.py
          .venv/bin/ruff check --fix \
            src/traceless_api/db/governance_models.py \
            src/traceless_api/models/governance.py \
            src/traceless_api/services/risk_governance.py \
            src/traceless_api/api/routes/governance.py \
            tests/test_risk_governance.py \
            migrations/versions/c4a8e2d7f910_add_closed_loop_risk_governance.py
      - name: Export OpenAPI
        working-directory: apps/api
        run: .venv/bin/python scripts/export_openapi.py ../web/openapi.json
      - name: Generate frontend contracts
        working-directory: apps/web
        run: |
          npm ci
          npm run generate:api
      - name: Test governance slice
        run: |
          cd apps/api
          .venv/bin/pytest -q tests/test_risk_governance.py tests/test_operational_auth.py
          cd ../web
          npm run test -- --run src/components/RiskGovernanceWorkspace.test.tsx src/App.test.tsx
          npm run build
      - name: Commit verified generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api apps/web
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Verify closed-loop risk governance slice'
          git push origin HEAD:agent/closed-loop-risk-platform
