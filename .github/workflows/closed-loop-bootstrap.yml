name: Closed-loop governance bootstrap

on:
  push:
    branches:
      - agent/closed-loop-risk-platform
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closed-loop-governance-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/closed-loop-risk-platform
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/uv.lock
      - name: Install backend
        working-directory: apps/api
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Generate migration
        working-directory: apps/api
        env:
          TRACELESS_DATABASE_URL: sqlite+pysqlite:///./closed-loop-autogen.db
          TRACELESS_AUTO_CREATE_SCHEMA: 'false'
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic revision --autogenerate -m 'add closed loop risk governance'
          rm -f closed-loop-autogen.db
      - name: Format and lint
        working-directory: apps/api
        run: |
          .venv/bin/ruff format \
            src/traceless_api/db/governance_models.py \
            src/traceless_api/models/governance.py \
            src/traceless_api/services/risk_governance.py \
            src/traceless_api/api/routes/governance.py \
            tests/test_risk_governance.py \
            migrations/versions/*closed_loop_risk_governance*.py
          .venv/bin/ruff check --fix \
            src/traceless_api/db/governance_models.py \
            src/traceless_api/models/governance.py \
            src/traceless_api/services/risk_governance.py \
            src/traceless_api/api/routes/governance.py \
            tests/test_risk_governance.py \
            migrations/versions/*closed_loop_risk_governance*.py
      - name: Export OpenAPI
        working-directory: apps/api
        run: .venv/bin/python scripts/export_openapi.py ../web/openapi.json
      - name: Test governance backend
        working-directory: apps/api
        run: .venv/bin/pytest -q tests/test_risk_governance.py tests/test_operational_auth.py tests/test_postgres_fullstack.py
      - name: Commit verified backend slice
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api apps/web/openapi.json
          git commit -m 'Add closed-loop risk governance backend'
          git push origin HEAD:agent/closed-loop-risk-platform
