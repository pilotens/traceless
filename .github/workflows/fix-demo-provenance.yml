name: Fix demo provenance

on:
  push:
    branches: [agent/initial-platform]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/initial-platform
      - name: Remove unsupported unversioned confidence
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('apps/api/tests/test_end_to_end_demo_chain.py')
          text = test.read_text()
          text = text.replace(
              '            "confidence": 0.96 if record_type == "vulnerability" else 0.90,\n',
              '',
          )
          test.write_text(text)

          demo = Path('apps/web/src/components/DemoWorkspace.tsx')
          text = demo.read_text()
          text = text.replace('        confidence: 0.96,\n', '')
          text = text.replace('        confidence: 0.9,\n', '')
          demo.write_text(text)
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/tests/test_end_to_end_demo_chain.py apps/web/src/components/DemoWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep demo intelligence provenance source-grounded'
          git push origin HEAD:agent/initial-platform
