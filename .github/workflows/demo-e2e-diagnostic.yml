name: Fix demo exploit status

on:
  push:
    branches: [agent/initial-platform]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/initial-platform
      - name: Apply contract correction
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'apps/api/tests/test_end_to_end_demo_chain.py',
              'apps/web/src/components/DemoWorkspace.tsx',
          ):
              path = Path(name)
              path.write_text(path.read_text().replace('proof_of_concept', 'poc'))
          diagnostic = Path('.diagnostics/demo-e2e.log')
          if diagnostic.exists():
              diagnostic.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A apps/api/tests/test_end_to_end_demo_chain.py apps/web/src/components/DemoWorkspace.tsx .diagnostics
          git commit -m 'fix: use canonical demo exploit status'
          git push origin HEAD:agent/initial-platform
