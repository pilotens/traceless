name: Demo E2E diagnostic

on:
  push:
    branches: [agent/initial-platform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Run isolated full-chain test
        continue-on-error: true
        run: .venv/bin/pytest -vv -s tests/test_end_to_end_demo_chain.py > /tmp/demo-e2e.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-diagnostic
          path: /tmp/demo-e2e.log
          retention-days: 1
