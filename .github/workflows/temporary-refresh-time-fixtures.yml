name: Temporary refresh time-sensitive test fixtures

on:
  push:
    branches:
      - chore/codex-cloud-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/codex-cloud-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Replace calendar-sensitive fixture timestamps
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          path = "apps/api/tests/test_end_to_end_demo_chain.py"
          replace_once(
              path,
              'NMAP_XML = b"""<?xml version="1.0" encoding="UTF-8"?>',
              'NMAP_SOURCE_TIME = int(datetime.now(UTC).timestamp()) - 300\n\n'
              'NMAP_XML = f"""<?xml version="1.0" encoding="UTF-8"?>',
          )
          replace_once(
              path,
              '<runstats><finished time="1784325600" exit="success"/></runstats>',
              '<runstats><finished time="{NMAP_SOURCE_TIME}" exit="success"/></runstats>',
          )
          replace_once(path, '</nmaprun>\n"""\n\n\ndef _headers', '</nmaprun>\n""".encode()\n\n\ndef _headers')

          path = "apps/api/tests/test_intelligence_hub.py"
          replace_once(
              path,
              'NMAP_XML = b"""<?xml version="1.0" encoding="UTF-8"?>',
              'NMAP_SOURCE_TIME = int(datetime.now(UTC).timestamp()) - 300\n\n'
              'NMAP_XML = f"""<?xml version="1.0" encoding="UTF-8"?>',
          )
          replace_once(
              path,
              '<runstats><finished time="1784325600" exit="success"/></runstats>',
              '<runstats><finished time="{NMAP_SOURCE_TIME}" exit="success"/></runstats>',
          )
          replace_once(
              path,
              '</nmaprun>\n"""\n\n\ndef _system_with_scan',
              '</nmaprun>\n""".encode()\n\n\ndef _system_with_scan',
          )

          path = "apps/api/tests/test_marking_policy.py"
          replace_once(
              path,
              '    scanned = client.post(\n'
              '        f"/api/v1/operational/systems/{system[\'id\']}/scans/import/nmap",',
              '    source_completed_at = int(datetime.now(UTC).timestamp()) - 300\n'
              '    scanned = client.post(\n'
              '        f"/api/v1/operational/systems/{system[\'id\']}/scans/import/nmap",',
          )
          replace_once(path, '        content=b"""<?xml version="1.0"?>', '        content=f"""<?xml version="1.0"?>')
          replace_once(path, 'start="1784325590"', 'start="{source_completed_at - 10}"')
          replace_once(path, 'time="1784325600" exit="success"', 'time="{source_completed_at}" exit="success"')
          replace_once(path, '        </nmaprun>""",\n        headers=', '        </nmaprun>""".encode(),\n        headers=')

          path = "apps/api/tests/test_operational_pipeline.py"
          replace_once(
              path,
              'NMAP_XML = b"""<?xml version="1.0" encoding="UTF-8"?>',
              'NMAP_SOURCE_TIME = int(datetime.now(UTC).timestamp()) - 300\n\n'
              'NMAP_XML = f"""<?xml version="1.0" encoding="UTF-8"?>',
          )
          replace_once(
              path,
              '<runstats><finished time="1784325600" exit="success"/></runstats>',
              '<runstats><finished time="{NMAP_SOURCE_TIME}" exit="success"/></runstats>',
          )
          replace_once(
              path,
              '</nmaprun>\n"""\n\nNMAP_EMPTY_XML = b"""',
              '</nmaprun>\n""".encode()\n\nNMAP_EMPTY_XML = f"""',
          )
          replace_once(
              path,
              '<runstats><finished time="1784325660" exit="success"/></runstats>',
              '<runstats><finished time="{NMAP_SOURCE_TIME + 60}" exit="success"/></runstats>',
          )
          replace_once(
              path,
              '</nmaprun>\n"""\n\nNETBOX_CREDENTIAL',
              '</nmaprun>\n""".encode()\n\nNETBOX_CREDENTIAL',
          )

          path = "apps/api/tests/test_scan_generation_lifecycle.py"
          replace_once(
              path,
              'BASE_SOURCE_TIME = 1_784_325_600',
              'BASE_SOURCE_TIME = int(datetime.now(UTC).timestamp()) - 300',
          )
          replace_once(
              path,
              'def _vendor_cve(client: TestClient, system_id: str) -> dict[str, object]:\n'
              '    response = client.post(',
              'def _vendor_cve(client: TestClient, system_id: str) -> dict[str, object]:\n'
              '    observed_at = datetime.fromtimestamp(BASE_SOURCE_TIME + 60, UTC).isoformat()\n'
              '    response = client.post(',
          )
          replace_once(path, '            "scan_completed_at": "2026-07-18T12:00:00Z",', '            "scan_completed_at": observed_at,')
          replace_once(path, '                    "observed_at": "2026-07-18T12:00:00Z",', '                    "observed_at": observed_at,')
          replace_once(
              path,
              '    endpoint = f"/api/v1/operational/systems/{system_id}/vulnerability-scans/import"\n\n'
              '    def payload(',
              '    endpoint = f"/api/v1/operational/systems/{system_id}/vulnerability-scans/import"\n'
              '    first_completed_at = datetime.fromtimestamp(\n'
              '        BASE_SOURCE_TIME + 60, UTC\n'
              '    ).isoformat()\n'
              '    second_completed_at = datetime.fromtimestamp(\n'
              '        BASE_SOURCE_TIME + 180, UTC\n'
              '    ).isoformat()\n\n'
              '    def payload(',
          )
          replace_once(
              path,
              '    opened = client.post(endpoint, json=payload("2026-07-18T10:00:00Z", "first.json"))',
              '    opened = client.post(endpoint, json=payload(first_completed_at, "first.json"))',
          )
          replace_once(
              path,
              '        json=payload("2026-07-19T10:00:00Z", "second.json"),',
              '        json=payload(second_completed_at, "second.json"),',
          )
          PY
      - name: Install locked API dependencies
        working-directory: apps/api
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
      - name: Validate changed tests
        working-directory: apps/api
        run: |
          .venv/bin/ruff check \
            tests/test_end_to_end_demo_chain.py \
            tests/test_intelligence_hub.py \
            tests/test_marking_policy.py \
            tests/test_operational_pipeline.py \
            tests/test_scan_generation_lifecycle.py
          .venv/bin/pytest \
            tests/test_end_to_end_demo_chain.py \
            tests/test_intelligence_hub.py \
            tests/test_marking_policy.py \
            tests/test_operational_pipeline.py \
            tests/test_scan_generation_lifecycle.py
      - name: Commit stable fixtures and remove this temporary workflow
        env:
          TARGET_BRANCH: chore/codex-cloud-foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-refresh-time-fixtures.yml
          git add apps/api/tests/test_end_to_end_demo_chain.py \
            apps/api/tests/test_intelligence_hub.py \
            apps/api/tests/test_marking_policy.py \
            apps/api/tests/test_operational_pipeline.py \
            apps/api/tests/test_scan_generation_lifecycle.py
          git diff --cached --check
          git commit -m "Stabilize time-sensitive scan fixtures"
          git push origin "HEAD:${TARGET_BRANCH}"
