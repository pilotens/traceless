name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyber-risk-graph-implementation
  cancel-in-progress: true

jobs:
  implement-cyber-risk-graph:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/initial-platform
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Prepare and apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/implement_cyber_risk_graph.py')
          text = path.read_text()
          start_marker = '# ---------------------------------------------------------------------------\n# Architecture tests need the new required graph field in their local type fixtures.\n'
          end_marker = '# ---------------------------------------------------------------------------\n# Documentation.\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
          text = text.replace(
              '"  type ArchitectureEdgeInput,\\n  type ArchitectureGraphInput,\\n"',
              '"  ArchitectureEdgeInput,\\n  ArchitectureGraphInput,\\n"',
          )
          text = text.replace(
              '"  type ArchitectureBusinessContextInput,\\n  type ArchitectureEdgeInput,\\n  type ArchitectureGraphInput,\\n"',
              '"  ArchitectureBusinessContextInput,\\n  ArchitectureEdgeInput,\\n  ArchitectureGraphInput,\\n"',
          )
          text = text.replace(
              'getOverview: vi.fn(async () => overview)',
              'getOverview: vi.fn(async (_systemId: string) => overview)',
          )
          path.write_text(text)
          PY
          python scripts/implement_cyber_risk_graph.py
      - name: Format backend and update contracts
        working-directory: apps/api
        run: |
          set +e
          {
            python -m pip install uv==0.11.28 &&
            uv sync --locked --extra dev &&
            .venv/bin/ruff format \
              src/traceless_api/models/operational.py \
              src/traceless_api/services/risk_graph.py \
              src/traceless_api/api/routes/operational.py \
              tests/test_risk_graph.py &&
            .venv/bin/ruff check --fix \
              src/traceless_api/models/operational.py \
              src/traceless_api/services/risk_graph.py \
              src/traceless_api/api/routes/operational.py \
              tests/test_risk_graph.py &&
            .venv/bin/python scripts/export_openapi.py ../web/openapi.json
          } > /tmp/cyber-risk-graph-format.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/cyber-risk-graph-format.log ../../cyber-risk-graph-format-error.log
            cd ../..
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add cyber-risk-graph-format-error.log
            git commit -m 'Capture cyber risk graph format error'
            git push --force-with-lease=refs/heads/agent/initial-platform:${{ github.event.pull_request.head.sha }} origin HEAD:agent/initial-platform
            cat /tmp/cyber-risk-graph-format.log
            exit "$status"
          fi
      - name: Test customer web
        working-directory: apps/web
        run: |
          npm ci
          npm run generate:api
          npm run test -- --run
          npm run build
      - name: Test backend risk graph
        working-directory: apps/api
        run: >-
          .venv/bin/pytest -q
          tests/test_risk_graph.py
          tests/test_architecture_and_vulnerability_imports.py
          tests/test_operational_pipeline.py
      - name: Commit product implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api apps/web docs
          git commit -m 'Add cyber risk graph and business context'
          git push --force-with-lease=refs/heads/agent/initial-platform:${{ github.event.pull_request.head.sha }} origin HEAD:agent/initial-platform
