name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-report-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/initial-platform
          fetch-depth: 0
      - name: Capture implementation error
        run: |
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/implement-report-builder.yml | sed '1d;$d;s/^          //' > /tmp/implement.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/implement.py')
          text = path.read_text()
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nimport textwrap\n', 1)
          text = text.replace('def replace(path: str, old: str, new: str) -> None:\n    file = Path(path)\n', 'def replace(path: str, old: str, new: str) -> None:\n    old = textwrap.dedent(old)\n    new = textwrap.dedent(new)\n    file = Path(path)\n', 1)
          path.write_text(text)
          PY
          set +e
          python /tmp/implement.py > implementation-error.log 2>&1
          status=$?
          echo "exit_status=$status" >> implementation-error.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add implementation-error.log
          git commit -m 'Capture normalized report builder error'
          git push origin HEAD:agent/initial-platform
