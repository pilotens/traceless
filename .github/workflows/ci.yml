name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-report-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/initial-platform
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply implementation script
        run: |
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/implement-report-builder.yml | sed '1d;$d;s/^          //' > /tmp/implement.py
          python scripts/prepare_report_builder_patch.py
          set +e
          python /tmp/implement.py > /tmp/report-builder-output.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/report-builder-output.log implementation-error.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add implementation-error.log
            git commit -m 'Capture report builder implementation error'
            git push origin HEAD:agent/initial-platform
            cat /tmp/report-builder-output.log
            exit "$status"
          fi
      - name: Format backend and update OpenAPI
        working-directory: apps/api
        run: |
          python -m pip install uv==0.11.28
          uv sync --locked --extra dev
          .venv/bin/ruff format src/traceless_api/models/operational.py src/traceless_api/services/reporting.py src/traceless_api/api/routes/reports.py src/traceless_api/job_worker.py tests/test_reporting.py
          .venv/bin/ruff check --fix src/traceless_api/models/operational.py src/traceless_api/services/reporting.py src/traceless_api/api/routes/reports.py src/traceless_api/job_worker.py tests/test_reporting.py
          .venv/bin/python scripts/export_openapi.py ../web/openapi.json
      - name: Test frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run generate:api
          npm run test -- --run
          npm run build
      - name: Test report backend
        working-directory: apps/api
        run: .venv/bin/pytest tests/test_reporting.py tests/test_background_jobs.py -q
      - name: Commit implementation and restore CI
        run: |
          git show 92e20dbb4a3387a3fe8c85bf3ab1634d057303c9:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/implement-report-builder.yml implementation-error.log scripts/prepare_report_builder_patch.py .report-builder-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement configurable report builder'
          git push origin HEAD:agent/initial-platform
