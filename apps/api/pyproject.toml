[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traceless-api"
version = "0.1.0"
description = "API for the Traceless security analysis platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "cryptography>=48.0.1,<49.0.0",
  "defusedxml>=0.7.1,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "reportlab>=4.4.0,<5.0.0",
  "sqlalchemy>=2.0.51,<2.1.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.scripts]
traceless-scan-worker = "traceless_api.worker:main"
traceless-job-worker = "traceless_api.job_worker:main"
traceless-external-intelligence-worker = "traceless_api.external_intelligence_worker:main"
traceless-intelligence-publisher = "traceless_api.publisher.cli:main"

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10.1,<3.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceless_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["traceless_api"]
omit = ["src/traceless_api/publisher/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
