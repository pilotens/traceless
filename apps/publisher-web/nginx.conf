server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${OIDC_CONNECT_SRC}" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /publisher-admin/ { proxy_pass http://publisher-admin:8100/; proxy_set_header Host publisher-admin; proxy_set_header X-Request-ID $request_id; proxy_buffering off; client_max_body_size 32m; }
    location /publisher-ingest/ { proxy_pass http://publisher-ingest:8102/; proxy_set_header Host publisher-ingest; proxy_set_header X-Request-ID $request_id; proxy_buffering off; client_max_body_size 32m; }
    location /publisher-review/ { proxy_pass http://publisher-review:8103/; proxy_set_header Host publisher-review; proxy_set_header X-Request-ID $request_id; proxy_buffering off; }
    location /publisher-feed/ { proxy_pass http://publisher-feed:8101/; proxy_set_header Host publisher-feed; proxy_set_header X-Request-ID $request_id; proxy_buffering off; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2|png|svg)$ { try_files $uri =404; }
}
